<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ma Boussole</title>
<meta name="theme-color" content="#0B1428" />
<meta name="description" content="Mandala Chart & suivi de carrière — Wend-Panga" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ma Boussole" />
<style>
  :root{
    --navy-deep:#0B1428;
    --navy:#131F38;
    --navy-soft:#1B2A4A;
    --gold:#C8962C;
    --gold-soft:#E8C377;
    --green:#3E8A67;
    --green-soft:#6FC79A;
    --cream:#F5F2EA;
    --muted:#8B96AC;
    --red:#C0605A;
    --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--navy-deep);}
  body{
    font-family:var(--font-body);
    color:var(--cream);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  #app{flex:1; display:flex; flex-direction:column; min-height:0;}

  /* ---------- Top bar ---------- */
  header.topbar{
    padding: max(14px, env(safe-area-inset-top)) 18px 12px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-bottom:1px solid rgba(200,150,44,0.15);
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand-mark{width:26px;height:26px;flex-shrink:0;}
  .brand-text{font-family:var(--font-display); font-size:17px; letter-spacing:0.5px; font-weight:700; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .phase-badge{
    font-size:10px; letter-spacing:1.2px; font-weight:700; text-transform:uppercase;
    color:var(--green-soft); background:rgba(62,138,103,0.15); border:1px solid rgba(111,199,154,0.35);
    padding:5px 9px; border-radius:20px; white-space:nowrap;
  }
  .lang-toggle{
    display:flex; border:1px solid rgba(200,150,44,0.4); border-radius:20px; overflow:hidden; flex-shrink:0;
  }
  .lang-btn{
    background:none; border:none; color:var(--muted); font-size:10.5px; font-weight:700; padding:5px 9px; cursor:pointer;
    letter-spacing:0.5px;
  }
  .lang-btn.active{background:var(--gold); color:var(--navy-deep);}

  /* ---------- Views ---------- */
  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:90px;}
  .view{display:none; padding:18px; animation:fadein .25s ease;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  h2.section-title{
    font-family:var(--font-display); font-size:20px; font-weight:700; margin:4px 0 14px 0; color:var(--cream);
  }
  p.section-sub{font-size:13px; color:var(--muted); margin:-8px 0 18px 0; line-height:1.5;}

  /* ---------- Boussole (radial mandala) ---------- */
  .compass-wrap{display:flex; justify-content:center; margin:6px 0 22px 0;}
  svg#compass{width:100%; max-width:420px; height:auto;}
  .compass-node{cursor:pointer;}
  .compass-node text{pointer-events:none;}

  .milestones{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px;}
  .milestone-chip{
    font-size:11px; font-weight:700; padding:6px 11px; border-radius:20px;
    background:rgba(62,138,103,0.15); color:var(--green-soft); border:1px solid rgba(111,199,154,0.35);
  }
  .milestone-chip.next{background:rgba(200,150,44,0.15); color:var(--gold-soft); border-color:rgba(200,150,44,0.4);}

  /* ---------- Ritual card ---------- */
  .ritual-card{
    background:var(--navy); border:1px solid rgba(200,150,44,0.22); border-radius:14px;
    margin-bottom:20px; overflow:hidden;
  }
  .ritual-head{
    display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer;
  }
  .ritual-title{font-size:14px; font-weight:700; color:var(--gold-soft); font-family:var(--font-display);}
  .ritual-chevron{color:var(--muted); font-size:13px; transition:transform .2s ease;}
  .ritual-card.open .ritual-chevron{transform:rotate(180deg);}
  .ritual-body{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    padding:0 16px;
  }
  .ritual-card.open .ritual-body{max-height:700px; padding:0 16px 16px 16px;}
  .ritual-block{margin-bottom:14px;}
  .ritual-block:last-of-type{margin-bottom:12px;}
  .ritual-block-label{
    font-size:10.5px; letter-spacing:0.5px; text-transform:uppercase; font-weight:700;
    color:var(--green-soft); margin-bottom:6px;
  }
  .ritual-steps{margin:0; padding-left:18px; font-size:12.5px; color:var(--cream); line-height:1.7;}
  .ritual-rule{
    font-size:11.5px; color:var(--muted); font-style:italic; line-height:1.5;
    border-top:1px solid rgba(255,255,255,0.08); padding-top:10px;
  }

  .axis-list{display:flex; flex-direction:column; gap:10px;}
  .axis-card{
    background:var(--navy); border:1px solid rgba(200,150,44,0.18); border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .axis-card:active{transform:scale(0.98);}
  .axis-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .axis-card .axis-name{font-size:14px; font-weight:600; color:var(--cream); flex:1;}
  .axis-card .axis-chevron{color:var(--muted); font-size:14px;}

  /* Axis detail sheet */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40;
    display:none; align-items:flex-end;
  }
  .sheet-overlay.active{display:flex;}
  .sheet{
    background:var(--navy); width:100%; max-height:80vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
    animation:slideup .22s ease;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--muted); opacity:0.4; border-radius:2px; margin:0 auto 16px auto;}
  .sheet h3{font-family:var(--font-display); font-size:18px; margin:0 0 4px 0;}
  .sheet .sheet-sub{font-size:12px; color:var(--muted); margin-bottom:14px;}
  .sub-item{
    display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06);
    font-size:13.5px; line-height:1.4;
  }
  .sub-item:last-child{border-bottom:none;}
  .phase-tag{
    font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px; flex-shrink:0; margin-top:2px;
  }
  .phase-tag.P1{background:rgba(62,138,103,0.2); color:var(--green-soft);}
  .phase-tag.P2{background:rgba(200,150,44,0.2); color:var(--gold-soft);}
  .phase-tag.P3{background:rgba(150,160,190,0.2); color:var(--muted);}

  /* ---------- Semaine (task form + suggestions) ---------- */
  .card{
    background:var(--navy); border:1px solid rgba(200,150,44,0.15); border-radius:16px; padding:18px; margin-bottom:16px;
  }
  label{display:block; font-size:11px; letter-spacing:0.6px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px 0; font-weight:600;}
  label:first-child{margin-top:0;}
  select, input[type=text], textarea{
    width:100%; background:var(--navy-deep); border:1px solid rgba(200,150,44,0.25); color:var(--cream);
    border-radius:10px; padding:11px 12px; font-size:14px; font-family:var(--font-body); outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--gold);}
  textarea{resize:vertical; min-height:44px;}

  .chip-group{margin-top:10px;}
  .chip-group-label{font-size:10px; color:var(--muted); letter-spacing:0.4px; margin-bottom:6px; text-transform:uppercase; font-weight:600;}
  .chip-scroll{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
  .verb-chip{
    flex-shrink:0; padding:7px 12px; border-radius:20px; font-size:12px; white-space:nowrap; cursor:pointer;
    background:var(--navy-deep); border:1px solid rgba(200,150,44,0.3); color:var(--cream);
  }
  .verb-chip:active{background:var(--gold); color:var(--navy-deep); border-color:var(--gold);}
  .verb-chip .en{font-weight:700;}
  .verb-chip .sep{color:var(--muted); margin:0 3px;}
  .verb-chip .fr{color:var(--muted);}
  .verb-chip:active .fr, .verb-chip:active .sep{color:var(--navy-deep); opacity:0.75;}

  .btn-primary{
    width:100%; margin-top:18px; padding:13px 0; border:none; border-radius:12px;
    background:var(--gold); color:var(--navy-deep); font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-primary:active{opacity:0.85;}

  .today-progress{margin:16px 0 14px 0;}
  .today-progress .bar-label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .today-progress .bar-track{height:8px; background:rgba(255,255,255,0.07); border-radius:6px; overflow:hidden;}
  .today-progress .bar-fill{height:100%; background:linear-gradient(90deg, var(--green), var(--green-soft)); border-radius:6px; transition:width .3s ease;}

  .entry-list{display:flex; flex-direction:column; gap:10px;}
  .entry{
    background:var(--navy); border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px;
    border-left:3px solid var(--muted);
  }
  .entry.ok{border-left-color:var(--green);}
  .entry.ko{border-left-color:var(--red);}
  .entry.mid{border-left-color:var(--gold);}
  .entry.pending{border-left-color:rgba(255,255,255,0.18);}
  .entry-emoji{
    font-size:19px; width:34px; height:34px; text-align:center; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.14);
    transition:transform .1s ease;
  }
  .entry-emoji:active{transform:scale(0.88);}
  .entry.ok .entry-emoji{border-color:var(--green); background:rgba(62,138,103,0.15);}
  .entry.ko .entry-emoji{border-color:var(--red); background:rgba(192,96,90,0.15);}
  .entry.mid .entry-emoji{border-color:var(--gold); background:rgba(200,150,44,0.15);}
  .entry-body{flex:1; min-width:0;}
  .entry-text{font-size:13.5px; color:var(--cream); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-meta{font-size:10.5px; color:var(--muted); margin-top:2px;}
  .entry-del{background:none; border:none; color:var(--muted); font-size:18px; padding:4px 6px; cursor:pointer;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; line-height:1.6;}

  /* ---------- Journal filters ---------- */
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; -webkit-overflow-scrolling:touch;}
  .filter-chip{
    flex-shrink:0; padding:7px 13px; border-radius:20px; font-size:12px; border:1px solid rgba(200,150,44,0.3);
    background:var(--navy); color:var(--muted); cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{background:var(--gold); color:var(--navy-deep); border-color:var(--gold); font-weight:700;}

  /* ---------- Bilan ---------- */
  .kpi-row{display:flex; gap:10px; margin-bottom:18px;}
  .kpi{flex:1; background:var(--navy); border-radius:14px; padding:16px 10px; text-align:center; border:1px solid rgba(200,150,44,0.15);}
  .kpi-num{font-family:var(--font-mono); font-size:24px; font-weight:700; color:var(--gold-soft);}
  .kpi-label{font-size:10px; color:var(--muted); margin-top:4px; letter-spacing:0.4px;}
  .bar-row{margin-bottom:14px;}
  .bar-label{display:flex; justify-content:space-between; font-size:12px; color:var(--cream); margin-bottom:5px;}
  .bar-track{height:9px; background:rgba(255,255,255,0.07); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--green), var(--green-soft)); border-radius:6px; transition:width .4s ease;}

  /* ---------- Bottom nav ---------- */
  nav.bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; background:var(--navy); border-top:1px solid rgba(200,150,44,0.18);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .navbtn{
    flex:1; background:none; border:none; color:var(--muted); padding:10px 2px 8px 2px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9.5px; cursor:pointer;
    font-family:var(--font-body); letter-spacing:0.2px; min-width:0;
  }
  .navbtn span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .navbtn svg{width:22px; height:22px;}
  .navbtn.active{color:var(--gold-soft);}
  .navbtn.active svg{filter:drop-shadow(0 0 6px rgba(200,150,44,0.4));}

  .fab-add{
    position:fixed; right:18px; bottom:calc(78px + env(safe-area-inset-bottom));
    width:54px; height:54px; border-radius:50%; background:var(--gold); color:var(--navy-deep);
    border:none; font-size:26px; box-shadow:0 6px 18px rgba(0,0,0,0.4); z-index:25; cursor:pointer;
    display:none; align-items:center; justify-content:center;
  }
  .fab-add.show{display:flex;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#C8962C" stroke-width="1.4" opacity="0.5"/><circle cx="20" cy="20" r="12" fill="none" stroke="#C8962C" stroke-width="1.4" opacity="0.7"/><circle cx="20" cy="20" r="4" fill="#C8962C"/></svg>
      <span class="brand-text">Ma Boussole</span>
    </div>
    <div class="topbar-right">
      <div class="lang-toggle">
        <button class="lang-btn" id="langFr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" id="langEn" onclick="setLang('en')">EN</button>
      </div>
      <span class="phase-badge" id="phaseBadge"></span>
    </div>
  </header>

  <main>
    <!-- BOUSSOLE -->
    <section class="view active" id="view-boussole">
      <h2 class="section-title" id="t_grid_title"></h2>
      <p class="section-sub" id="t_grid_sub"></p>

      <div class="milestones">
        <span class="milestone-chip" id="t_milestone1"></span>
        <span class="milestone-chip" id="t_milestone2"></span>
        <span class="milestone-chip next" id="t_milestone3"></span>
      </div>

      <div class="ritual-card" id="ritualCard">
        <div class="ritual-head" onclick="toggleRitual()">
          <span class="ritual-title" id="t_ritual_title"></span>
          <span class="ritual-chevron" id="ritualChevron">▾</span>
        </div>
        <div class="ritual-body" id="ritualBody">
          <div class="ritual-block">
            <div class="ritual-block-label" id="t_ritual_daily_label"></div>
            <ol class="ritual-steps" id="t_ritual_daily_steps"></ol>
          </div>
          <div class="ritual-block">
            <div class="ritual-block-label" id="t_ritual_weekly_label"></div>
            <ol class="ritual-steps" id="t_ritual_weekly_steps"></ol>
          </div>
          <div class="ritual-rule" id="t_ritual_rule"></div>
        </div>
      </div>

      <div class="compass-wrap"><svg id="compass" viewBox="0 0 400 400"></svg></div>
      <div class="axis-list" id="axisList"></div>
    </section>

    <!-- SEMAINE / TODAY -->
    <section class="view" id="view-semaine">
      <h2 class="section-title" id="t_today_title"></h2>
      <p class="section-sub" id="t_today_sub"></p>

      <div class="card">
        <label id="t_label_axis"></label>
        <select id="fAxis"></select>
        <label id="t_label_task"></label>
        <textarea id="fText"></textarea>

        <div class="chip-group">
          <div class="chip-group-label" id="t_verbs_generic_label"></div>
          <div class="chip-scroll" id="verbsGeneric"></div>
        </div>
        <div class="chip-group">
          <div class="chip-group-label" id="t_verbs_axis_label"></div>
          <div class="chip-scroll" id="verbsAxis"></div>
        </div>

        <button class="btn-primary" id="t_btn_add" onclick="addEntry()"></button>
      </div>

      <div class="today-progress" id="todayProgress"></div>
      <div class="entry-list" id="todayList"></div>

      <h2 class="section-title" style="font-size:15px; margin-top:26px;" id="t_prev_days_title"></h2>
      <div class="entry-list" id="recentList"></div>
    </section>

    <!-- JOURNAL -->
    <section class="view" id="view-journal">
      <h2 class="section-title" id="t_journal_title"></h2>
      <div class="filter-row" id="filterRow"></div>
      <div class="entry-list" id="journalList"></div>
    </section>

    <!-- BILAN -->
    <section class="view" id="view-bilan">
      <h2 class="section-title" id="t_bilan_title"></h2>
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-num" id="kpiTotal">0</div><div class="kpi-label" id="t_kpi_total"></div></div>
        <div class="kpi"><div class="kpi-num" id="kpiRate">0%</div><div class="kpi-label" id="t_kpi_rate"></div></div>
        <div class="kpi"><div class="kpi-num" id="kpiStreak">0</div><div class="kpi-label" id="t_kpi_streak"></div></div>
      </div>
      <h2 class="section-title" style="font-size:15px;" id="t_axis_breakdown"></h2>
      <div id="axisBars"></div>
    </section>
  </main>

  <button class="fab-add" id="fabAdd" onclick="showView('semaine')">＋</button>

  <nav class="bottomnav">
    <button class="navbtn active" data-view="boussole" onclick="showView('boussole')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
      <span id="t_nav_boussole"></span>
    </button>
    <button class="navbtn" data-view="semaine" onclick="showView('semaine')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span id="t_nav_semaine"></span>
    </button>
    <button class="navbtn" data-view="journal" onclick="showView('journal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h11l3 3v15H5z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>
      <span id="t_nav_journal"></span>
    </button>
    <button class="navbtn" data-view="bilan" onclick="showView('bilan')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span id="t_nav_bilan"></span>
    </button>
  </nav>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="sheetTitle"></h3>
    <div class="sheet-sub" id="sheetSub"></div>
    <div id="sheetItems"></div>
  </div>
</div>

<script>
/* ============ i18n STRINGS ============ */
const STR = {
  fr: {
    nav_boussole:"Boussole", nav_semaine:"Aujourd'hui", nav_journal:"Journal", nav_bilan:"Bilan",
    grid_title:"La grille",
    grid_sub:"Objectif central : expert international reconnu, influence sur les politiques de développement en Afrique — horizon 15-20 ans.",
    milestone1:"✓ Thèse soutenue", milestone2:"✓ LAFMA CAMES obtenue", milestone3:"🎯 LAFMC visée 2030",
    ritual_title:"🧭 Ton rituel",
    ritual_daily_label:"Quotidien · après la prière du matin · 5 min",
    ritual_daily_steps:["Ouvrir l'app (10 s)","Regarder hier, marquer honnêtement (1 min)","Loguer 1 à 3 tâches du jour (3 min)","Coup d'œil au badge de phase (30 s)"],
    ritual_weekly_label:"Hebdomadaire · dimanche soir · 15-20 min",
    ritual_weekly_steps:["Bilan de la semaine (3 min)","Relire le journal, chercher un pattern (5 min)","Identifier l'axe le plus négligé (2 min)","Fixer 2-3 priorités (pas 8) pour la semaine (5 min)","Une ligne de satisfaction — ce qui a marché (2 min)"],
    ritual_rule:"Règle unique : si un jour tu n'as vraiment pas 5 min, fais au moins l'étape 1+2 (30 s). N'oublie jamais d'ouvrir l'app — c'est ça qui tient l'habitude, pas la complétude.",
    today_title:"Aujourd'hui",
    today_sub:"Le matin : ajoute tes tâches. Dans la journée : tape sur le cercle pour cocher. Le soir : regarde le Bilan.",

/* ============ COMPASS (radial mandala) ============ */
function buildCompass(){
  const svg = document.getElementById('compass');
  const CX=200, CY=200, R=150;
  let html = '';
  [175,150,120,90].forEach((r,i)=>{
    html += `<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="#C8962C" stroke-width="1" opacity="${0.08+i*0.03}"/>`;
  });
  html += `<circle cx="${CX}" cy="${CY}" r="72" fill="#0B1428" stroke="#E8C377" stroke-width="1.2" opacity="0.9"/>`;
  const goalLines = lang==='fr' ? ["EXPERT","INTERNATIONAL","RECONNU"] : ["RECOGNIZED","INTERNATIONAL","EXPERT"];
  html += `<text x="${CX}" y="${CY-10}" text-anchor="middle" fill="#F5F2EA" font-size="10.5" font-weight="700" font-family="Georgia,serif">${goalLines[0]}</text>`;
  html += `<text x="${CX}" y="${CY+6}" text-anchor="middle" fill="#F5F2EA" font-size="10.5" font-weight="700" font-family="Georgia,serif">${goalLines[1]}</text>`;
  html += `<text x="${CX}" y="${CY+22}" text-anchor="middle" fill="#C8962C" font-size="10.5" font-weight="700" font-family="Georgia,serif">${goalLines[2]}</text>`;

  AXES.forEach((axis,i)=>{
    const ang = (i * 360/8) * Math.PI/180;
    const x = CX + R*Math.sin(ang), y = CY - R*Math.cos(ang);
    const ix = CX + 90*Math.sin(ang), iy = CY - 90*Math.cos(ang);
    html += `<line x1="${ix}" y1="${iy}" x2="${x}" y2="${y}" stroke="${axis.color}" stroke-width="1" opacity="0.5"/>`;
    html += `<g class="compass-node" onclick="openAxis(${i})">
      <circle cx="${x}" cy="${y}" r="17" fill="${axis.color}" opacity="0.92"/>
      <text x="${x}" y="${y+4}" text-anchor="middle" fill="${axis.color==='#C8962C'?'#0B1428':'#F5F2EA'}" font-size="13" font-weight="700">${i+1}</text>
    </g>`;
  });
  svg.innerHTML = html;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function populateAxisSelect(){
  const sel = document.getElementById('fAxis');
  const prev = sel.value;
  sel.innerHTML = AXES.map((a,i)=>`<option value="${i}">${t('axis_label_short')} ${i+1} — ${a.title[lang]}</option>`).join('');
  if(prev !== '') sel.value = prev;
  sel.onchange = renderVerbChips;
}

function insertAtCursor(word){
  const ta = document.getElementById('fText');
  const start = ta.selectionStart ?? ta.value.length;
  const end = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0, start);
  const after = ta.value.slice(end);
  const needsSpace = before.length && !before.endsWith(' ') && !before.endsWith('\n');
  const insertion = (needsSpace ? ' ' : '') + word + ' ';
  ta.value = before + insertion + after;
  const pos = (before + insertion).length;
  ta.focus();
  ta.setSelectionRange(pos, pos);
}

function verbChip(v){
  const primary = v[lang] || v.en;
  const secondary = lang==='fr' ? v.en : v.fr;
  return `<div class="verb-chip" onclick="insertAtCursor('${primary.replace(/'/g,"\\'")}')">
    <span class="${lang==='fr'?'fr':'en'}">${primary}</span><span class="sep">/</span><span class="${lang==='fr'?'en':'fr'}">${secondary}</span>
  </div>`;
}
function renderVerbChips(){
  document.getElementById('verbsGeneric').innerHTML = VERBS_GENERIC.map(verbChip).join('');
  const axisIdx = parseInt(document.getElementById('fAxis').value || 0);
  document.getElementById('verbsAxis').innerHTML = (VERBS_BY_AXIS[axisIdx]||[]).map(verbChip).join('');
}

function addEntry(){
  const axisIdx = parseInt(document.getElementById('fAxis').value);
  const text = document.getElementById('fText').value.trim();
  if(!text){ document.getElementById('fText').focus(); return; }
  entries.unshift({id:Date.now(), date:todayStr(), axisIdx, text, status:'pending'});
  saveEntries(entries);
  document.getElementById('fText').value='';
  renderToday(); renderRecent();
}
function deleteEntry(id){
  entries = entries.filter(e=>e.id!==id);
  saveEntries(entries);
  renderToday(); renderRecent(); renderJournal(); renderBilan();
}
const STATUS_CYCLE = ['pending','ok','mid','ko'];
function cycleStatus(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  const idx = STATUS_CYCLE.indexOf(e.status);
  e.status = STATUS_CYCLE[(idx+1) % STATUS_CYCLE.length];
  saveEntries(entries);
  renderToday(); renderRecent(); renderJournal(); renderBilan();
}
function emojiFor(s){ return s==='ok'?'✅':s==='ko'?'❌':s==='mid'?'🟡':'⬜'; }
function entryRow(e){
  const axis = AXES[e.axisIdx];
  return `<div class="entry ${e.status}">
    <div class="entry-emoji" onclick="cycleStatus(${e.id})">${emojiFor(e.status)}</div>
    <div class="entry-body">
      <div class="entry-text">${e.text}</div>
      <div class="entry-meta">${e.date} · ${t('axis_label_short')} ${e.axisIdx+1} — ${axis?axis.title[lang]:''}</div>
    </div>
    <button class="entry-del" onclick="deleteEntry(${e.id})">×</button>
  </div>`;
}
function renderToday(){
  const today = todayStr();
  const todays = entries.filter(e => e.date === today);
  const list = document.getElementById('todayList');
  list.innerHTML = todays.length ? todays.map(entryRow).join('') : `<div class="empty-state">${t('empty_today')}</div>`;

  const treated = todays.filter(e => e.status !== 'pending').length;
  const ok = todays.filter(e => e.status === 'ok').length;
  const pct = todays.length ? Math.round(treated/todays.length*100) : 0;
  document.getElementById('todayProgress').innerHTML = todays.length ? `
    <div class="bar-label"><span>${treated}/${todays.length} ${t('treated_label')}</span><span>${ok} ✅</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>` : '';
}
function renderRecent(){
  const today = todayStr();
  const cutoff = Date.now() - 7*24*3600*1000;
  const recent = entries.filter(e => e.date !== today && new Date(e.date).getTime() >= cutoff - 86400000);
  const list = document.getElementById('recentList');
  list.innerHTML = recent.length ? recent.map(entryRow).join('') : `<div class="empty-state">${t('empty_prev')}</div>`;
}

/* ============ JOURNAL ============ */
let journalFilter = 'all';
function buildFilters(){
  const row = document.getElementById('filterRow');
  let html = `<div class="filter-chip ${journalFilter==='all'?'active':''}" data-f="all" onclick="setFilter('all')">${t('filter_all')}</div>`;
  AXES.forEach((a,i)=> html += `<div class="filter-chip ${journalFilter===i?'active':''}" data-f="${i}" onclick="setFilter(${i})">${t('axis_label_short')} ${i+1}</div>`);
  row.innerHTML = html;
}
function setFilter(f){
  journalFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active', c.dataset.f==String(f)));
  renderJournal();
}
function renderJournal(){
  let list = entries.slice();
  if(journalFilter !== 'all') list = list.filter(e=>e.axisIdx===journalFilter);
  const el = document.getElementById('journalList');
  el.innerHTML = list.length ? list.map(entryRow).join('') : `<div class="empty-state">${t('empty_journal')}</div>`;
}

/* ============ BILAN / DASHBOARD ============ */
function renderBilan(){
  const treated = entries.filter(e=>e.status!=='pending').length;
  const ok = entries.filter(e=>e.status==='ok').length;
  const rate = treated ? Math.round(ok/treated*100) : 0;
  const days = new Set(entries.map(e=>e.date)).size;
  document.getElementById('kpiTotal').textContent = entries.length;
  document.getElementById('kpiRate').textContent = rate+'%';
  document.getElementById('kpiStreak').textContent = days;

  const counts = AXES.map((a,i)=>entries.filter(e=>e.axisIdx===i).length);
  const max = Math.max(1, ...counts);
  document.getElementById('axisBars').innerHTML = AXES.map((a,i)=>`
    <div class="bar-row">
      <div class="bar-label"><span>${i+1}. ${a.title[lang]}</span><span>${counts[i]}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${counts[i]/max*100}%; background:${a.color}"></div></div>
    </div>`).join('');
}

/* ============ RITUAL CARD ============ */
function toggleRitual(){
  const card = document.getElementById('ritualCard');
  const isOpen = card.classList.toggle('open');
  localStorage.setItem('ritual_open', isOpen ? '1' : '0');
}
if(localStorage.getItem('ritual_open') === '1'){
  document.getElementById('ritualCard').classList.add('open');
}

/* ============ INIT ============ */
applyLanguage();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
